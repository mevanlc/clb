[package]
name = "clipby"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "clb"
path = "src/main.rs"

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.6", features = ["derive", "cargo"] }
clap_complete = "4.6.9"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
walkdir = "2.5.0"
which = "8.0.5"
